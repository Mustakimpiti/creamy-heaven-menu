<title>Creamy Heaven — A Spoonful Of Heaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E8;
    --cream-deep:#FFEBCF;
    --pink:#FF2E82;
    --pink-deep:#E01467;
    --orange:#FF7A3D;
    --lime:#5FD62E;
    --lime-deep:#3FAE12;
    --plum:#2B1330;
    --plum-soft:#5B3F5E;
    --paper:#FFFFFF;
    --hairline: rgba(43,19,48,0.07);
    --shadow: 0 10px 30px rgba(43,19,48,0.10);
    --shadow-lift: 0 18px 34px rgba(43,19,48,0.16);
    --topbar-h: 60px;
    --nav-h: 62px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; -webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--plum);
    font-family:'Nunito',sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;}
  h1,h2,h3, .display{
    font-family:'Baloo 2', 'Nunito', sans-serif;
    margin:0;
  }
  :focus-visible{outline:3px solid var(--pink-deep); outline-offset:3px; border-radius:8px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  /* ---------- Ambient blobs ---------- */
  .blob-field{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:0.28; will-change:transform;}
  .blob.b1{width:220px; height:220px; background:var(--lime); top:-60px; left:-60px; animation:drift1 22s ease-in-out infinite;}
  .blob.b2{width:160px; height:160px; background:var(--pink); top:20%; right:-50px; animation:drift2 26s ease-in-out infinite;}
  .blob.b3{width:190px; height:190px; background:var(--orange); bottom:8%; left:-70px; animation:drift1 19s ease-in-out infinite reverse;}
  .blob.b4{width:130px; height:130px; background:var(--pink); bottom:-40px; right:10%; animation:drift2 24s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.08);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-25px,30px) scale(0.95);}}
  @media (max-width:600px){
    .blob{opacity:0.18;}
    .blob.b1,.blob.b3{width:150px; height:150px;}
    .blob.b2,.blob.b4{width:110px; height:110px;}
  }

  /* ---------- Fixed brand topbar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:40;
    height:var(--topbar-h);
    display:flex; align-items:center; gap:10px;
    padding:0 clamp(16px,4vw,40px);
    background:rgba(255,246,232,0);
    transition:background .3s ease, box-shadow .3s ease, backdrop-filter .3s ease;
    pointer-events:none;
  }
  .topbar.solid{
    background:rgba(255,246,232,0.92); backdrop-filter:blur(10px);
    box-shadow:0 2px 14px rgba(43,19,48,0.08);
    pointer-events:auto;
  }
  .topbar img{width:34px; height:34px; border-radius:9px; object-fit:cover; flex:0 0 auto;}
  .topbar .word{
    font-family:'Baloo 2'; font-weight:700; font-size:1.05rem; color:var(--plum);
    opacity:0; transform:translateY(4px); transition:opacity .3s ease, transform .3s ease;
    white-space:nowrap;
  }
  .topbar.solid .word{opacity:1; transform:translateY(0);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative; z-index:1;
    min-height:min(100vh, 820px);
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:clamp(60px,10vh,90px) 20px clamp(80px,14vh,110px);
  }
  .logo-wrap{
    animation:bob 4.5s ease-in-out infinite;
    filter:drop-shadow(0 16px 24px rgba(43,19,48,0.18));
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-14px) rotate(1deg);}}
  .logo-wrap img{width:clamp(180px, 42vw, 300px); display:block; border-radius:28px;}

  .hero .tagline{
    font-family:'Baloo 2';
    font-weight:600;
    font-size:clamp(1.1rem, 2.6vw, 1.6rem);
    color:var(--plum-soft);
    margin-top:14px;
    letter-spacing:0.3px;
  }
  .hero .cta-row{margin-top:32px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .pulse-note{
    font-weight:800; font-family:'Baloo 2'; font-size:clamp(0.85rem,2vw,0.95rem);
    color:var(--paper); background:linear-gradient(120deg,var(--pink),var(--orange));
    padding:10px 22px; border-radius:999px; box-shadow:var(--shadow);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.05);}}

  .scroll-cue{
    position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
    font-size:0.82rem; color:var(--plum-soft); font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    animation:cueMove 1.8s ease-in-out infinite;
  }
  @keyframes cueMove{0%,100%{transform:translate(-50%,0);} 50%{transform:translate(-50%,8px);}}

  /* ---------- Drip divider (signature element) ---------- */
  .drip{display:block; width:100%; height:clamp(40px,7vw,70px); margin-top:-2px; position:relative; z-index:2;}
  .drip svg{width:100%; height:100%; display:block;}

  /* ---------- Category nav ---------- */
  .catnav{
    position:sticky; top:0; z-index:20;
    background:rgba(255,246,232,0.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--hairline);
    padding:12px 0;
  }
  .catnav-inner{
    display:flex; gap:10px; overflow-x:auto; padding:0 clamp(16px,4vw,40px);
    scrollbar-width:none; max-width:1280px; margin:0 auto;
  }
  .catnav-inner::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'Baloo 2'; font-weight:600; font-size:0.9rem;
    padding:9px 17px; border-radius:999px; border:2px solid transparent;
    background:var(--paper); color:var(--plum);
    cursor:pointer; white-space:nowrap;
    box-shadow:0 3px 8px rgba(43,19,48,0.07);
    transition:transform .18s ease, background .25s ease, color .25s ease;
  }
  .chip:hover{transform:translateY(-2px);}
  .chip.active{
    background:linear-gradient(120deg,var(--pink),var(--orange));
    color:#fff;
  }

  /* ---------- Layout / sections ---------- */
  main{position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:10px clamp(16px,4vw,40px) 60px;}
  section.cat{padding:clamp(40px,7vw,60px) 0 8px; scroll-margin-top:calc(var(--nav-h) + 12px);}
  .cat-head{display:flex; align-items:baseline; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .cat-head h2{font-size:clamp(1.4rem,3vw,2rem); color:var(--plum);}
  .cat-head .swatch{width:13px; height:13px; border-radius:50%; display:inline-block; flex:0 0 auto;}
  .cat-head .sub{font-weight:700; color:var(--plum-soft); font-size:0.9rem; margin-left:auto;}

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:clamp(10px,2vw,16px);
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3, 1fr);} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4, 1fr);} }
  @media (min-width:1180px){ .grid{grid-template-columns:repeat(5, 1fr);} }

  .card{
    background:var(--paper); border-radius:18px; padding:clamp(14px,2.4vw,18px) clamp(14px,2.4vw,18px) 15px;
    box-shadow:var(--shadow);
    border:1px solid var(--hairline);
    position:relative; overflow:hidden;
    opacity:0; transform:translateY(24px) scale(0.97);
    transition:transform .4s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
    min-width:0;
  }
  .card.in-view{opacity:1; transform:translateY(0) scale(1); animation:pop .5s cubic-bezier(.22,1,.36,1);}
  @keyframes pop{0%{opacity:0; transform:translateY(24px) scale(0.95);} 100%{opacity:1; transform:translateY(0) scale(1);}}
  @media (hover:hover){
    .card:hover{transform:translateY(-5px) rotate(-0.3deg); box-shadow:var(--shadow-lift);}
    .card:hover .price-pill{background:var(--accent, var(--pink)); color:#fff; transform:scale(1.04);}
  }
  .card::before{
    content:""; position:absolute; top:-40px; right:-40px; width:100px; height:100px;
    border-radius:50%; background:var(--accent, var(--pink)); opacity:0.10;
  }
  .card h3{
    font-family:'Baloo 2'; font-size:clamp(0.92rem,1.6vw,1.06rem); font-weight:700;
    color:var(--plum); line-height:1.28;
    word-break:break-word; hyphens:auto;
  }
  .card .price-row{margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;}
  .price-pill{
    font-family:'Baloo 2'; font-weight:700; font-size:0.82rem;
    background:var(--cream-deep); color:var(--plum);
    padding:5px 11px; border-radius:999px;
    transition:transform .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .price-pill b{font-size:0.68rem; font-weight:800; opacity:0.65; margin-right:3px;}

  .cat-scoops .card{--accent:var(--lime);}
  .cat-cones .card{--accent:var(--orange);}
  .cat-shakes .card{--accent:var(--pink);}
  .cat-bev .card{--accent:var(--lime);}
  .cat-litre .card{--accent:var(--orange);}
  .cat-treats .card{--accent:var(--pink);}
  .cat-parlour .card{--accent:var(--lime);}
  .cat-roll .card{--accent:var(--orange);}

  .flat-note{
    display:inline-block; margin-bottom:18px; font-weight:800; font-family:'Baloo 2';
    font-size:0.92rem; color:var(--pink-deep); margin-top:-8px;
  }

  footer{
    position:relative; z-index:1; text-align:center;
    padding:clamp(40px,7vw,54px) 20px clamp(50px,8vw,64px);
    color:var(--plum-soft);
  }
  footer .thanks{
    font-family:'Baloo 2'; font-weight:700; font-size:clamp(1.1rem,2.6vw,1.3rem); color:var(--plum);
    margin-bottom:8px;
  }
  footer p{max-width:480px; margin:6px auto 0; font-size:0.95rem; line-height:1.5;}

  .back-top{
    position:fixed; z-index:30;
    bottom:calc(20px + env(safe-area-inset-bottom));
    right:calc(20px + env(safe-area-inset-right));
    width:46px; height:46px; border-radius:50%;
    background:linear-gradient(120deg,var(--pink),var(--orange));
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); cursor:pointer; font-size:1.15rem; font-weight:800;
    border:none;
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  .back-top.show{opacity:1; pointer-events:auto;}
  @media (hover:hover){ .back-top:hover{transform:translateY(-3px);} }

  @media (max-width:380px){
    .grid{grid-template-columns:repeat(2,1fr); gap:9px;}
    .card{padding:12px;}
  }

  @media (min-width:1440px){
    main{max-width:1360px;}
    .catnav-inner{max-width:1360px;}
  }
</style>
</head>

  nav.appendChild(chip);

  const sec = document.createElement('section');
  sec.className = 'cat ' + CAT_CLASS[cat.id];
  sec.id = 'sec-'+cat.id;

  let cardsHTML = '';
  if(cat.items){
    cardsHTML = cat.items.map(n=>`
      <div class="card">
        <h3>${n}</h3>
        <div class="price-row"><span class="price-pill">K${cat.price}</span></div>
      </div>`).join('');
  } else if(cat.priced){
    cardsHTML = cat.priced.map(o=>`
      <div class="card">
        <h3>${o.n}</h3>
        <div class="price-row"><span class="price-pill">K${o.p}</span></div>
      </div>`).join('');
  } else if(cat.shakes){
    cardsHTML = cat.shakes.map(s=>{
      let pills='';
      if(s.sm) pills += `<span class="price-pill"><b>SM</b>K${s.sm}</span>`;
      if(s.big) pills += `<span class="price-pill"><b>BIG</b>K${s.big}</span>`;
      if(s.thick) pills += `<span class="price-pill"><b>THICK</b>K${s.thick}</span>`;
      return `<div class="card"><h3>${s.n}</h3><div class="price-row">${pills}</div></div>`;
    }).join('');
  }

  sec.innerHTML = `
    <div class="cat-head">
      <span class="swatch" style="background:${CAT_COLOR[cat.id]}"></span>
      <h2>${cat.label}</h2>
      ${cat.note ? `<span class="sub">${cat.note}</span>` : ''}
    </div>
    <div class="grid">${cardsHTML}</div>
  `;
  main.appendChild(sec);
});

// topbar solid state
const topbar = document.getElementById('topbar');
const heroEl = document.querySelector('.hero');
const topbarObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    topbar.classList.toggle('solid', !entry.isIntersecting);
  });
}, {rootMargin:"-70% 0px 0px 0px"});
topbarObserver.observe(heroEl);

// active chip on scroll
const chips = [...nav.querySelectorAll('.chip')];
const sections = DATA.map(c=>document.getElementById('sec-'+c.id));

const chipObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const id = entry.target.id.replace('sec-','');
      chips.forEach(c=>c.classList.toggle('active', c.dataset.target===id));
    }
  });
}, {rootMargin:"-40% 0px -50% 0px"});
sections.forEach(s=>chipObserver.observe(s));

// keep active chip scrolled into view within the nav
function keepChipVisible(){
  const active = nav.querySelector('.chip.active');
  if(active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}
const chipVisObserver = new MutationObserver(keepChipVisible);
chips.forEach(c=>chipVisObserver.observe(c, {attributes:true, attributeFilter:['class']}));

// card entrance animation
const cardObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('in-view');
      cardObserver.unobserve(entry.target);
    }
  });
}, {threshold:0.12});
document.querySelectorAll('.card').forEach((c,i)=>{
  c.style.transitionDelay = (Math.min(i%8,8)*0.035)+'s';
  cardObserver.observe(c);
});

// back to top
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', ()=>{
  backTop.classList.toggle('show', window.scrollY>500);
}, {passive:true});
backTop.addEventListener('click', ()=>window.scrollTo({top:0, behavior:'smooth'}));
</script>
